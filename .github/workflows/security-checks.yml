name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/security-hardening.test.cjs
      - run: node tests/activity.test.cjs
      - run: node tests/idle-session.test.cjs
      - run: node tests/transfer-criteria.test.cjs
      - run: node tests/transfer-supplier.test.cjs
      - run: node tests/production-pdf.test.cjs
      - name: Keep private master files out of Git
        run: |
          if git ls-files | grep -Ei '(^|/)(products\.csv|TRANSFER_CONF\.csv|branch-access\.private\.(csv|json))$'; then
            echo 'Private master data must not be committed.'
            exit 1
          fi
